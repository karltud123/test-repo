name: Cancel Superseded Releases

# Reusable workflow, called by release-v2.yml the moment a release is approved
# to proceed to production.
#
# Single-trunk problem: every merge to `main` fires a `release-v2` run, and each
# one parks in the `waiting` state at `pre-production-approval`. Several can be
# queued up at once. As soon as ONE of them is approved and heads to
# deploy-production, the older pending runs are stale — production is about to
# reflect a newer commit, so those earlier approvals should never fire.
#
# This cancels every OTHER active run of release-v2.yml on `main` that is older
# (lower run_number) than the run calling us. Newer pending runs are left alone:
# they may carry commits this deploy does not include, so they stay approvable.
#
# Reusable workflows share the caller's run id/number, so `github.run_id` /
# `github.run_number` below already refer to the release run that was approved —
# no inputs needed.

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded:
    name: Cancel older pending releases
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older pending release runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const currentRunNumber = context.runNumber;
            const workflowFile = 'release-v2.yml';

            core.info(`This release: id=${currentRunId} #${currentRunNumber}`);

            // Only target runs still PARKED before production: `waiting` (sitting
            // at the pre-production-approval gate) or `queued` (not started yet).
            // Deliberately NOT `in_progress` — a run in that state may be actively
            // deploying to production, and cancelling it mid-deploy could leave prod
            // half-applied. The worst case we allow is two prod deploys back-to-back
            // (safe); we never interrupt one in flight.
            const cancellableStatuses = ['waiting', 'queued'];

            // De-dupe across status queries by run id.
            const runs = new Map();
            for (const status of cancellableStatuses) {
              const found = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflowFile,
                branch: 'main',
                status,
                per_page: 100,
              });
              for (const run of found) runs.set(run.id, run);
            }

            let cancelled = 0;
            for (const run of runs.values()) {
              if (run.id === currentRunId) continue;

              // Only cancel OLDER runs. A newer pending run may include commits
              // this production deploy does not, so leave it to be approved later.
              if (run.run_number >= currentRunNumber) {
                core.info(`Keep run ${run.id} (#${run.run_number}) — not older than this release`);
                continue;
              }

              // Re-check status: a run may have moved off the gate (e.g. to
              // `in_progress`) between the listing above and now. Never cancel a
              // run that is no longer parked — it could be mid production deploy.
              if (!cancellableStatuses.includes(run.status)) {
                core.info(`Keep run ${run.id} (#${run.run_number}) — status '${run.status}' is not a parked state`);
                continue;
              }

              core.info(`Cancel superseded run ${run.id} (#${run.run_number}, status=${run.status})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled++;
              } catch (err) {
                // A run parked at a deployment gate can reject a plain cancel;
                // fall back to force-cancel. Never fail the job over this — the
                // production deploy is the priority.
                core.warning(`Plain cancel failed for ${run.id} (${err.message}); trying force-cancel`);
                try {
                  await github.rest.actions.forceCancelWorkflowRun({ owner, repo, run_id: run.id });
                  cancelled++;
                } catch (forceErr) {
                  core.warning(`Force-cancel also failed for ${run.id}: ${forceErr.message}`);
                }
              }
            }

            core.info(`Cancelled ${cancelled} superseded release run(s).`);
